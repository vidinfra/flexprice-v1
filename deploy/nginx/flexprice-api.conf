# FlexPrice API - Nginx Configuration
# Copy to /etc/nginx/sites-available/flexprice-api
# Then: ln -s /etc/nginx/sites-available/flexprice-api /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d api-billing.tenbyte.io

server {
    server_name api-billing.tenbyte.io;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    listen 80;
}

# After running certbot, SSL config will be added automatically
