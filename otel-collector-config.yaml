# OpenTelemetry Collector Configuration
# Receives traces from FlexPrice and forwards to SigNoz via OTLP

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  # Add resource attributes
  resource:
    attributes:
      - key: service.namespace
        value: tenbyte
        action: upsert

exporters:
  # Forward to SigNoz via OTLP HTTP (SigNoz listens on 4320)
  otlphttp/signoz:
    endpoint: http://signoz:4320
    tls:
      insecure: true

  # Logging for debugging (optional)
  logging:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/signoz]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/signoz]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/signoz]
