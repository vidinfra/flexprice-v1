# OpenTelemetry Collector Configuration for SigNoz
# Uses existing FlexPrice ClickHouse with signoz database

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  # Add resource attributes
  resource:
    attributes:
      - key: service.namespace
        value: tenbyte
        action: upsert

exporters:
  # Debug exporter for local testing
  debug:
    verbosity: basic

  # ClickHouse exporter for traces (SigNoz schema)
  clickhousetraces:
    datasource: tcp://flexprice:flexprice123@clickhouse:9000/signoz
    docker_multi_node_cluster: false
    low_cardinal_exception_grouping: false

  # ClickHouse exporter for metrics
  clickhousemetricswrite:
    endpoint: tcp://flexprice:flexprice123@clickhouse:9000/signoz
    resource_to_telemetry_conversion:
      enabled: true

  # ClickHouse exporter for logs
  clickhouselogsexporter:
    dsn: tcp://flexprice:flexprice123@clickhouse:9000/signoz
    docker_multi_node_cluster: false
    timeout: 5s
    sending_queue:
      queue_size: 100
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [clickhousetraces]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [clickhousemetricswrite]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [clickhouselogsexporter]
